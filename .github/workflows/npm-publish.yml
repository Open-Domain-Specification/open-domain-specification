name: Lerna Workflow

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  # Releasing is deliberate: run this workflow by hand when the time is right.
  # A push to main builds and tests like any other branch and publishes nothing.
  workflow_dispatch:
    inputs:
      release:
        description: 'Cut a version and publish to npm'
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - name: Package the VS Code extension
        run: |
          mkdir -p artifacts
          npm run package --workspace ods-vscode -- --out "$GITHUB_WORKSPACE/artifacts/ods-vscode.vsix"
      - uses: actions/upload-artifact@v4
        with:
          name: ods-vscode-vsix
          path: artifacts/ods-vscode.vsix

  # The pages Playwright suite, kept out of `npm test` so a developer's unit run
  # never has to build browsers. Its own job so a browser failure reads as a
  # browser failure rather than a red `npm test`.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      # Every workspace, not just pages: global-setup imports the package's own
      # `dist/site.js`, and the docsify spec walks the petstore's generated docs.
      - run: npm run build
      # Keyed on the lockfile, which is what pins the Playwright version the
      # browser build has to match.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      # Unconditional: a cache hit still needs the system libraries Chromium
      # links against, and `install` skips the download when the cached browser
      # already matches the pinned version.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the pages end-to-end suite
        working-directory: packages/pages
        run: npx playwright test
      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: packages/pages/test-results
          retention-days: 7
          if-no-files-found: ignore

  publish:
    runs-on: ubuntu-latest
    needs: [test, e2e]
    # Never on a push. Lerna decides the version from the commits, so a merge to
    # main used to publish whatever had accumulated; releasing is now something
    # somebody asks for, from main, with the release input set.
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.release &&
      github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      # Full history and the branch head (not the triggering sha) so a re-run
      # after a failed publish sees the version commit lerna already pushed.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - name: Set Git Config
        run: |
          git config user.name "$(git log -n 1 --pretty=format:%an)"
          git config user.email "$(git log -n 1 --pretty=format:%ae)"
      - name: Record the version before publishing
        id: before
        run: echo "version=$(node -p "require('./lerna.json').version")" >> "$GITHUB_OUTPUT"
      # Builds every workspace, cuts a version if commits warrant one, then
      # publishes whatever the registry is missing (idempotent on re-runs). The
      # script is not called "publish": npm would run it as a lifecycle hook.
      - run: npm run release
        env:
          NPM_TOKEN: ${{secrets.NPM_TOKEN}}
      - name: Record the version after publishing
        id: after
        run: echo "version=$(node -p "require('./lerna.json').version")" >> "$GITHUB_OUTPUT"

      # The remaining steps only run when lerna actually cut a new version, and
      # so pushed the v<version> tag the release hangs off.
      - name: Package the VS Code extension
        if: steps.before.outputs.version != steps.after.outputs.version
        run: |
          mkdir -p artifacts
          npm run package --workspace ods-vscode -- \
            --out "$GITHUB_WORKSPACE/artifacts/ods-vscode-${{ steps.after.outputs.version }}.vsix"
      - name: Archive the pages site
        if: steps.before.outputs.version != steps.after.outputs.version
        run: |
          mkdir -p artifacts
          (cd packages/pages/app && zip -qr "$GITHUB_WORKSPACE/artifacts/ods-pages-${{ steps.after.outputs.version }}.zip" .)
      - name: Create the GitHub release
        if: steps.before.outputs.version != steps.after.outputs.version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v${{ steps.after.outputs.version }}" \
            --title "v${{ steps.after.outputs.version }}" \
            --generate-notes \
            artifacts/*.vsix artifacts/*.zip
