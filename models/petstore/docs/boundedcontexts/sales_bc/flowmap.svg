<!-- #/boundedcontexts/sales_bc/processes/order_fulfilment -->
<g id="node1" class="node">
<title>#/boundedcontexts/sales_bc/processes/order_fulfilment</title>
<g id="a_node1"><a xlink:title="From an order being placed to the pet being sold. It starts on OrderPlaced and waits, because the pet may not be available yet: a relisting (PetStatusChanged) makes it look up the placed orders for that petId, confirm availability through GetPetSummary and approve the oldest. On approval it holds the pet (available → pending), and once the order is delivered it tells the catalogue the pet has gone to its owner (pending → sold). It does not listen to PetReserved: that is the fact this very chain produces. Correlation is by petId and then orderId; an order nobody can fulfil is cancelled by hand, which is why there is no timeout here">
<polygon fill="#d1c4e9" stroke="black" points="244.36,-134.63 241.36,-138.63 220.36,-138.63 217.36,-134.63 162.54,-134.63 162.54,-98.63 244.36,-98.63 244.36,-134.63"/>
<text xml:space="preserve" text-anchor="middle" x="203.45" y="-113.63" font-family="sans-serif" font-size="10.00">Order fulfilment</text>
</a>
</g>
</g>
